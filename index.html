<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMC 键鼠控制器</title>
    <link rel="icon" href="./resources/image/favicon.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Consolas', sans-serif;
        }

        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .navbar {
            background-color: #ffffff;
            height: clamp(76px, 6.5vw, 92px);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(20px, 2vw, 36px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            z-index: 100;
            position: relative;
        }

        .navbar-logo {
            height: clamp(54px, 6.2vw, 68px);
            display: flex;
            align-items: center;
        }

        .navbar-logo img {
            height: 100%;
            object-fit: contain;
        }

        .logo-desktop {
            margin-left: -10px;
        }

        .logo-mobile {
            display: none;
        }

        .navbar-links {
            display: flex;
            gap: clamp(24px, 2.5vw, 38px);
        }

        .navbar-links a,
        .navbar-links button {
            text-decoration: none;
            color: #222222;
            font-size: clamp(1.4rem, 1.8vw, 1.6rem);
            font-weight: bold;
            padding: clamp(10px, 1.2vw, 14px) clamp(24px, 2.4vw, 34px);
            border-radius: 10px;
            transition: color 0.4s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .navbar-links a::after,
        .navbar-links button::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: clamp(24px, 2.4vw, 34px);
            width: 0;
            height: 2px;
            background-color: currentColor;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .navbar-links a:hover::after,
        .navbar-links button:hover::after {
            width: calc(100% - (clamp(24px, 2.4vw, 34px) * 2));
        }

        .nav-home:hover { color: #0055cc; background-color: rgba(0, 85, 204, 0.08); }
        .nav-download:hover { color: #10b981; background-color: rgba(16, 185, 129, 0.08); }
        .nav-faq:hover { color: #d97706; background-color: rgba(217, 119, 6, 0.08); }
        .nav-sponsor:hover { color: #dc3545; background-color: rgba(220, 53, 69, 0.08); }

        .nav-home.active { color: #0055cc; }
        .nav-download.active { color: #10b981; }
        .nav-faq.active { color: #d97706; }
        .nav-sponsor.active { color: #dc3545; }

        .navbar-links a.active::after,
        .navbar-links button.active::after {
            width: calc(100% - (clamp(24px, 2.4vw, 34px) * 2));
        }

        .hamburger {
            display: none;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: background-color 0.3s ease;
            background-color: transparent;
            border: none;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .hamburger:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .hamburger span {
            display: block;
            width: 26px;
            height: 3px;
            background-color: #222222;
            border-radius: 2px;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hamburger.open span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.open span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .scroll-container {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .scroll-container::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        .scroll-container::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        .scroll-container {
            scrollbar-width: thin;
            scrollbar-color: #d1d5db transparent;
        }

        .main-content {
            flex: 1;
            width: 100%;
            position: relative;
        }

        .page {
            display: none;
            width: 100%;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0.6; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-banner {
            position: relative;
            width: 100%;
            background-color: #ffffff;
        }

        .hero-banner img {
            width: 100%;
            display: block;
            min-height: clamp(350px, 38vw, 450px);
            object-fit: cover;
            background-color: #ffffff;
        }

        .floating-cards {
            position: absolute;
            right: clamp(30px, 3.5vw, 40px);
            top: clamp(30px, 3.5vw, 40px);
            display: flex;
            flex-direction: column;
            gap: clamp(20px, 2.5vw, 30px);
            width: clamp(340px, 32vw, 400px);
            z-index: 10;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: clamp(30px, 3.5vw, 40px) clamp(25px, 2.8vw, 30px);
            font-size: 1rem;
            font-weight: normal;
            color: #333333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: clamp(180px, 17vw, 200px);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #111111;
            font-weight: normal;
        }

        .card p {
            line-height: 1.6;
            color: #555555;
            margin-bottom: 20px;
        }

        .card-btn {
            display: inline-block;
            background-color: #0055cc;
            color: #ffffff;
            text-decoration: none;
            padding: clamp(10px, 1.2vw, 12px) clamp(18px, 1.8vw, 22px);
            border-radius: 6px;
            text-align: center;
            transition: background-color 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            font-size: 1rem;
            align-self: flex-start;
            cursor: pointer;
            border: none;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .card-btn:hover {
            background-color: #0044aa;
        }

        .other-page-content {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 40px;
            text-align: left;
        }

        .other-page-content h2 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: #111;
            text-align: left;
            outline: none;
        }

        .other-page-content p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #555;
            text-align: left;
            margin-bottom: 30px;
        }

        .download-desc {
            margin-bottom: 45px;
        }

        .download-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
            align-items: start;
        }

        .download-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .download-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .download-card .version {
            font-size: 1.3rem;
            font-weight: bold;
            color: #111111;
            margin-bottom: 4px;
        }

        .download-card .date {
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 16px;
        }

        .download-card .links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .download-card .links a,
        .download-card .links button {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 6px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            transition: opacity 0.2s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .download-card .links a:hover,
        .download-card .links button:hover {
            opacity: 0.85;
        }

        .link-123 { background-color: #3b82f6; }
        .link-lanzou { background-color: #f59e0b; }
        .link-baidu { background-color: #ef4444; }
        .link-bili { background-color: #f472b6; }
        .qq-number { color: #0055cc; font-weight: bold; }

        .notice-card {
            position: relative;
            overflow: hidden;
            height: clamp(180px, 17vw, 200px);
        }

        .notice-content {
            flex: 1;
            display: grid;
            position: relative;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 10px;
        }

        .notice-content::-webkit-scrollbar {
            width: 4px;
        }
        .notice-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .notice-content::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        .notice-content::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        .notice-page {
            grid-area: 1 / 1;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }

        .notice-page.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .notice-dots {
            display: flex;
            gap: 8px;
            margin-top: auto;
            align-items: center;
            padding-top: 8px;
        }

        .notice-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e0e0e0;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            border: none;
            padding: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .notice-dot:hover {
            transform: scale(1.3);
        }

        .notice-dot.active {
            background-color: #888888;
        }

        .sponsor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .sponsor-qr {
            width: 260px;
            height: 260px;
            object-fit: contain;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .sponsor-qr:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.15);
        }

        .sponsor-note {
            margin-top: 15px;
            font-size: 1rem;
            color: #555555;
            font-weight: bold;
        }

        .sponsor-disclaimer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #888888;
            text-align: center;
            background-color: #f9f9f9;
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
        }

        .footer {
            padding: 20px 20px 40px 20px;
            text-align: center;
        }

        .footer-divider {
            height: 1px;
            background-color: #eaeaea;
            width: 100%;
            margin-top: 100px;
            margin-bottom: 30px;
        }

        .footer p {
            color: #888888;
            font-size: 0.9rem;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .footer a {
            color: #0055cc;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #0044aa;
            text-decoration: underline;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.6;
            visibility: hidden;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.5s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0s;
        }

        .modal-overlay.closing {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.5s;
        }

        .modal-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 35px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            opacity: 0.6;
            transform: scale(0.95) translateY(6px);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-overlay.active .modal-box {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .modal-overlay.closing .modal-box {
            opacity: 0;
            transform: scale(0.95) translateY(6px);
        }

        .modal-box h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #111;
        }

        .modal-box p {
            color: #555;
            margin-bottom: 25px;
            font-size: 1rem;
            line-height: 1.6;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-buttons button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            font-family: inherit;
            border: none;
            outline: none;
            font-weight: bold;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn-cancel {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-cancel:hover {
            background-color: #e0e0e0;
        }

        .btn-confirm {
            background-color: #0055cc;
            color: #ffffff;
        }

        .btn-confirm:hover {
            background-color: #0044aa;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 1024px) {
            .navbar {
                padding: 0 20px;
                height: 70px;
            }

            .navbar-logo {
                height: 44px;
            }

            .logo-desktop {
                display: none;
                margin-left: 0;
            }

            .logo-mobile {
                display: block;
            }

            .hamburger {
                display: flex;
            }

            .navbar-links {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background-color: #ffffff;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
                padding: 0 20px;
                gap: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.5s cubic-bezier(0.22, 1, 0.36, 1), padding 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            }

            .navbar-links.open {
                max-height: 500px;
                padding: 15px 20px 25px 20px;
            }

            .navbar-links a,
            .navbar-links button {
                font-size: 1.15rem;
                padding: 14px 16px;
                border-radius: 8px;
                width: 100%;
                text-align: center;
            }

            .navbar-links a::after,
            .navbar-links button::after {
                display: none;
            }

            .scroll-container {
                height: calc(100vh - 70px);
                height: calc(100dvh - 70px);
            }

            .hero-banner img {
                display: none;
            }

            .hero-banner {
                padding-top: 20px;
            }

            .floating-cards {
                position: static;
                width: 100%;
                padding: 20px;
                gap: 15px;
            }

            .card {
                padding: 25px 20px;
                min-height: auto;
            }

            .card-btn {
                width: 100%;
                align-self: stretch;
            }

            .other-page-content {
                margin: 30px auto;
                padding: 0 20px;
            }

            .download-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .sponsor-qr {
                width: 220px;
                height: 220px;
            }

            .footer-divider {
                margin-top: 60px;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="navbar-logo">
            <img class="logo-desktop" alt="">
            <img class="logo-mobile" alt="">
        </div>

        <button class="hamburger" type="button" onclick="toggleMenu(this)" aria-label="菜单" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="navbar-links" id="navMenu"></nav>
    </header>

    <div class="scroll-container" id="main-scroller">
        <main class="main-content" id="mainContent"></main>
        <footer class="footer" id="pageFooter"></footer>
    </div>

    <div class="modal-overlay" id="downloadModal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-box">
            <h3 id="modal-title"></h3>
            <p id="modal-desc"></p>
            <div class="modal-buttons">
                <button class="btn-cancel" type="button" onclick="closeDownloadModal()"></button>
                <button class="btn-confirm" type="button" id="modal-confirm-btn" onclick="confirmDownload()"></button>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
         * 全局状态
         * ============================================================ */
        let CONTENT = null;
        let modalCloseTimer = null;
        let currentDownloadUrl = '';
        let lastFocusedElement = null;
        let currentNotice = 0;
        let autoSwitchTimer = null;
        let manualCooldownTimer = null;

        /* ============================================================
         * Meta / 品牌 / 导航 / 内容渲染
         * ============================================================ */

        function setMeta(attr, key, val) {
            let el = document.querySelector('meta[' + attr + '="' + key + '"]');
            if (!el) {
                el = document.createElement('meta');
                el.setAttribute(attr, key);
                document.head.appendChild(el);
            }
            el.setAttribute('content', val);
        }

        function applyMeta() {
            const m = CONTENT.meta;
            document.documentElement.lang = m.lang;
            document.title = m.title;

            const fav = document.querySelector('link[rel="icon"]');
            if (fav) fav.href = m.favicon;

            setMeta('name', 'description', m.description);
            setMeta('name', 'theme-color', m.themeColor);
            setMeta('property', 'og:type', m.og.type);
            setMeta('property', 'og:title', m.og.title);
            setMeta('property', 'og:description', m.og.description);
            setMeta('property', 'og:image', m.og.image);
            setMeta('property', 'og:url', m.og.url);
            setMeta('name', 'twitter:card', m.twitter.card);
            setMeta('name', 'twitter:title', m.twitter.title);
            setMeta('name', 'twitter:description', m.twitter.description);
            setMeta('name', 'twitter:image', m.twitter.image);
        }

        function renderBrand() {
            const b = CONTENT.brand;
            const desktop = document.querySelector('.logo-desktop');
            const mobile = document.querySelector('.logo-mobile');
            desktop.src = b.logoDesktop.src;
            desktop.alt = b.logoDesktop.alt;
            mobile.src = b.logoMobile.src;
            mobile.alt = b.logoMobile.alt;

            const burger = document.querySelector('.hamburger');
            if (burger && CONTENT.hamburger) {
                burger.setAttribute('aria-label', CONTENT.hamburger.ariaLabel);
            }
        }

        function renderNav() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = CONTENT.nav.map(function (item) {
                return '<button type="button" class="' + item.className + '" data-page="' + item.id + '" onclick="switchPage(\'' + item.id + '\')">' + item.label + '</button>';
            }).join('');
        }

        function renderHome() {
            const c = CONTENT.home;
            const notices = c.notices.map(function (n, i) {
                return '' +
                    '<div class="notice-page' + (i === 0 ? ' active' : '') + '" data-notice-index="' + i + '">' +
                        '<h3>' + n.title + '</h3>' +
                        '<p>' + n.body + '</p>' +
                    '</div>';
            }).join('');
            const dots = c.notices.map(function (n, i) {
                return '<button type="button" class="notice-dot' + (i === 0 ? ' active' : '') + '" data-notice-dot="' + i + '" aria-label="' + n.dotLabel + '"></button>';
            }).join('');

            return '' +
                '<div id="page-home" class="page">' +
                    '<h2 class="sr-only">' + c.srTitle + '</h2>' +
                    '<div class="hero-banner">' +
                        '<img src="' + c.heroImage.src + '" alt="' + c.heroImage.alt + '">' +
                        '<div class="floating-cards">' +
                            '<div class="card">' +
                                '<div>' +
                                    '<h3>' + c.mainCard.title + '</h3>' +
                                    '<p>' + c.mainCard.description + '</p>' +
                                '</div>' +
                                '<button type="button" class="card-btn" data-cta>' + c.mainCard.cta.label + '</button>' +
                            '</div>' +
                            '<div class="card notice-card">' +
                                '<div class="notice-content">' + notices + '</div>' +
                                '<div class="notice-dots">' + dots + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        }

        function renderDownloads() {
            const c = CONTENT.downloads;
            const cards = c.items.map(function (item, i) {
                const links = item.links.map(function (link, j) {
                    return '<button type="button" class="link-' + link.type + '"' +
                        ' data-download-link' +
                        ' data-version-index="' + i + '"' +
                        ' data-link-index="' + j + '">' +
                        link.label +
                    '</button>';
                }).join('');
                return '' +
                    '<div class="download-card">' +
                        '<div class="version">' + item.version + '</div>' +
                        '<div class="date">' + item.date + '</div>' +
                        '<div class="links">' + links + '</div>' +
                    '</div>';
            }).join('');

            return '' +
                '<div id="page-downloads" class="page">' +
                    '<div class="other-page-content">' +
                        '<h2>' + c.title + '</h2>' +
                        '<p class="download-desc">' + c.description + '</p>' +
                        '<div class="download-grid">' + cards + '</div>' +
                    '</div>' +
                '</div>';
        }

        function renderFaq() {
            const c = CONTENT.faq;
            return '' +
                '<div id="page-faq" class="page">' +
                    '<div class="other-page-content">' +
                        '<h2>' + c.title + '</h2>' +
                        '<p>' + c.description + '</p>' +
                    '</div>' +
                '</div>';
        }

        function renderSponsor() {
            const c = CONTENT.sponsor;
            const paragraphs = c.paragraphs.map(function (p) {
                return '<p>' + p + '</p>';
            }).join('');

            return '' +
                '<div id="page-sponsor" class="page">' +
                    '<div class="other-page-content">' +
                        '<h2>' + c.title + '</h2>' +
                        paragraphs +
                        '<div class="sponsor-container">' +
                            '<img src="' + c.qr.src + '" alt="' + c.qr.alt + '" class="sponsor-qr" loading="lazy" decoding="async">' +
                            '<p class="sponsor-note">' + c.note + '</p>' +
                        '</div>' +
                        '<p class="sponsor-disclaimer">' + c.disclaimer + '</p>' +
                    '</div>' +
                '</div>';
        }

        function renderMain() {
            const main = document.getElementById('mainContent');
            main.innerHTML = renderHome() + renderDownloads() + renderFaq() + renderSponsor();
        }

        function renderFooter() {
            const c = CONTENT.footer;
            document.getElementById('pageFooter').innerHTML = '' +
                '<div class="footer-divider"></div>' +
                '<p>' + c.copyright + '</p>' +
                '<p>Bilibili: <a href="' + c.bilibiliUrl + '" target="_blank" rel="noopener noreferrer">' + c.bilibiliLabel + '</a></p>' +
                '<p>' + c.tagline + '</p>';
        }

        function renderModalStaticText() {
            document.querySelector('.btn-cancel').textContent = CONTENT.modal.cancelText;
        }

        /* ============================================================
         * 页面路由
         * ============================================================ */

        function switchPage(pageId) {
            let targetPage = document.getElementById('page-' + pageId);
            if (!targetPage) {
                pageId = 'home';
                targetPage = document.getElementById('page-home');
                if (!targetPage) return;
            }

            document.querySelectorAll('.navbar-links button').forEach(function (link) {
                link.classList.remove('active');
                link.removeAttribute('aria-current');
            });

            const targetNav = document.querySelector('.navbar-links [data-page="' + pageId + '"]');
            if (targetNav) {
                targetNav.classList.add('active');
                targetNav.setAttribute('aria-current', 'page');
            }

            document.querySelectorAll('.page').forEach(function (page) {
                page.classList.remove('active');
            });
            targetPage.classList.add('active');

            const scroller = document.getElementById('main-scroller');
            if (scroller) {
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                scroller.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
            }

            closeMenu();

            if (location.hash.substring(1) !== pageId) {
                history.replaceState(null, '', '#' + pageId);
            }

            const h2 = targetPage.querySelector('h2');
            if (h2) {
                h2.setAttribute('tabindex', '-1');
                h2.focus({ preventScroll: true });
            }
        }

        /* ============================================================
         * 下载弹窗
         * ============================================================ */

        function showDownloadModal(link, version) {
            const modal = document.getElementById('downloadModal');
            if (!modal || !CONTENT) return;

            const tpl = (link.type === 'bili') ? CONTENT.modal.bilibili : CONTENT.modal.download;
            const platform = link.platform || '';

            const title = tpl.titleTemplate.replace('{platform}', platform);
            const desc = tpl.descTemplate
                .replace('{platform}', platform)
                .replace('{version}', version || '');

            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            document.getElementById('modal-confirm-btn').textContent = tpl.confirmText;

            currentDownloadUrl = link.url;
            lastFocusedElement = document.activeElement;

            if (modalCloseTimer) {
                clearTimeout(modalCloseTimer);
                modalCloseTimer = null;
            }

            modal.classList.remove('closing');
            modal.classList.add('active');

            setTimeout(function () {
                const confirmBtn = document.getElementById('modal-confirm-btn');
                if (confirmBtn) confirmBtn.focus();
            }, 50);
        }

        function closeDownloadModal() {
            const modal = document.getElementById('downloadModal');
            if (!modal) return;
            if (!modal.classList.contains('active') || modal.classList.contains('closing')) return;

            modal.classList.add('closing');

            modalCloseTimer = setTimeout(function () {
                modal.classList.remove('active');
                modal.classList.remove('closing');
                modalCloseTimer = null;

                if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') {
                    lastFocusedElement.focus();
                    lastFocusedElement = null;
                }
            }, 500);
        }

        function confirmDownload() {
            if (currentDownloadUrl) {
                window.open(currentDownloadUrl, '_blank', 'noopener,noreferrer');
            }
            closeDownloadModal();
        }

        /* ============================================================
         * 移动端菜单
         * ============================================================ */

        function toggleMenu(btn) {
            const menu = document.getElementById('navMenu');
            const isOpen = menu.classList.toggle('open');
            btn.classList.toggle('open', isOpen);
            btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        }

        function closeMenu() {
            const menu = document.getElementById('navMenu');
            const btn = document.querySelector('.hamburger');
            if (!menu || !btn) return;
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                btn.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            }
        }

        /* ============================================================
         * 公告轮播
         * ============================================================ */

        function switchNotice(index) {
            const pages = document.querySelectorAll('.notice-page');
            const dots = document.querySelectorAll('.notice-dot');
            if (pages.length === 0) return;

            pages.forEach(function (page, i) {
                page.classList.toggle('active', i === index);
                if (dots[i]) dots[i].classList.toggle('active', i === index);
            });
            currentNotice = index;
        }

        function startNoticeAutoSwitch() {
            const total = document.querySelectorAll('.notice-page').length;
            if (total <= 1) return;
            if (autoSwitchTimer) clearInterval(autoSwitchTimer);
            autoSwitchTimer = setInterval(function () {
                const nextIndex = (currentNotice + 1) % total;
                switchNotice(nextIndex);
            }, 10000);
        }

        function manualSwitchNotice(index) {
            switchNotice(index);

            if (autoSwitchTimer) clearInterval(autoSwitchTimer);
            if (manualCooldownTimer) clearTimeout(manualCooldownTimer);

            manualCooldownTimer = setTimeout(function () {
                startNoticeAutoSwitch();
            }, 60000);
        }

        /* ============================================================
         * 事件委托
         * ============================================================ */

        function bindGlobalEvents() {
            const main = document.getElementById('mainContent');

            main.addEventListener('click', function (e) {
                const ctaBtn = e.target.closest('[data-cta]');
                if (ctaBtn) {
                    const cta = CONTENT.home.mainCard.cta;
                    showDownloadModal(cta, cta.version);
                    return;
                }

                const dlBtn = e.target.closest('[data-download-link]');
                if (dlBtn) {
                    const i = Number(dlBtn.dataset.versionIndex);
                    const j = Number(dlBtn.dataset.linkIndex);
                    const item = CONTENT.downloads.items[i];
                    if (!item) return;
                    const link = item.links[j];
                    if (!link) return;
                    showDownloadModal(link, item.version);
                    return;
                }

                const dot = e.target.closest('[data-notice-dot]');
                if (dot) {
                    manualSwitchNotice(Number(dot.dataset.noticeDot));
                    return;
                }
            });

            const modal = document.getElementById('downloadModal');
            if (modal) {
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) closeDownloadModal();
                });
            }

            document.addEventListener('keydown', function (e) {
                const m = document.getElementById('downloadModal');
                if (!m) return;

                if (e.key === 'Escape' && m.classList.contains('active')) {
                    closeDownloadModal();
                    return;
                }

                if (e.key !== 'Tab') return;
                if (!m.classList.contains('active') || m.classList.contains('closing')) return;

                const focusable = m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                if (focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            });

            window.addEventListener('resize', function () {
                if (window.innerWidth > 1024) closeMenu();
            });

            window.addEventListener('hashchange', function () {
                const pageId = location.hash.substring(1) || 'home';
                switchPage(pageId);
            });
        }

        /* ============================================================
         * 内容加载 + 启动
         * ============================================================ */

        async function loadContent() {
            const url = './resources/inf/content.json';
            const res = await fetch(url, { cache: 'no-cache' });
            if (!res.ok) throw new Error('加载 ' + url + ' 失败：HTTP ' + res.status);
            return res.json();
        }

        function showLoadError(err) {
            document.body.innerHTML = '' +
                '<div style="padding:60px 20px;max-width:640px;margin:0 auto;text-align:center;font-family:\'Microsoft YaHei\',sans-serif;line-height:1.8;">' +
                    '<h2 style="margin-bottom:16px;">内容加载失败</h2>' +
                    '<p>无法加载 <code>./resources/inf/content.json</code></p>' +
                    '<p style="color:#888;">如果您是直接双击打开 <code>index.html</code>（<code>file://</code> 协议），浏览器会因 CORS 策略拒绝读取本地 JSON</p>' +
                    '<p style="color:#888;">请用本地服务器运行，例如在项目目录执行 <code>python -m http.server 8000</code>，然后访问 <code>http://localhost:8000</code></p>' +
                    '<p style="color:#aaa;font-size:0.85em;margin-top:20px;">' + String(err) + '</p>' +
                '</div>';
        }

        async function init() {
            try {
                CONTENT = await loadContent();
            } catch (err) {
                console.error(err);
                showLoadError(err);
                return;
            }

            applyMeta();
            renderBrand();
            renderNav();
            renderMain();
            renderFooter();
            renderModalStaticText();
            bindGlobalEvents();

            const pageId = location.hash.substring(1) || 'home';
            switchPage(pageId);
            startNoticeAutoSwitch();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
