<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMC 键鼠控制器</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('kamc-theme');
                var theme = (saved === 'dark' || saved === 'light') ? saved
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="icon" href="./resources/image/favicon.png" type="image/x-icon">
    <meta name="description" content="KAMC 键鼠控制器：Windows 平台的键鼠连点、操作脚本与操作可视化工具，免费开源，支持 64 位 Windows 10 / 11。">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <noscript>
        <div class="nojs-notice">
            <strong>当前禁用了 JavaScript。</strong>
            本站的版本列表与常见问题由脚本从 JSON 载入，禁用后无法展示。
            你可以直接访问 <a href="https://kamc.top">kamc.top</a> 下载最新版本，或查看
            <a href="./resources/inf/content.json">content.json</a>。
        </div>
    </noscript>

    <header class="navbar">
        <a class="navbar-logo" href="https://kamc.top" aria-label="返回 KAMC 首页">
            <img class="logo-desktop" src="./resources/image/official_website_logo.png" alt="KAMC 官网">
            <img class="logo-mobile" src="./resources/image/logo512.png" alt="KAMC 官网">
        </a>

        <div class="navbar-actions">
            <button class="theme-toggle-mobile" id="themeToggleMobile" type="button" aria-label="切换到暗色主题" aria-pressed="false">
                <span class="theme-icon icon-sun" aria-hidden="true"></span>
            </button>
            <button class="hamburger" type="button" onclick="toggleMenu(this)" aria-label="菜单" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <nav class="navbar-links" id="navMenu">
            <a class="nav-home" href="#home">首页</a>
            <a class="nav-download" href="#downloads">下载</a>
            <a class="nav-faq" href="#faq">常见问题</a>
            <a class="nav-sponsor" href="#sponsor">赞助</a>
        </nav>
    </header>

    <div class="scroll-container" id="main-scroller">
        <main class="main-content" id="mainContent">
            <section class="static-fallback">
                <h1>KAMC 键鼠控制器</h1>
                <p>一款免费开源的 Windows 键鼠效率工具，包含键鼠连点、操作脚本、定时任务与操作可视化。</p>
                <p>正在载入最新内容…</p>
                <p class="static-links">
                    <a href="https://kamc.top">官网首页</a> ·
                    <a href="#downloads">下载</a> ·
                    <a href="#faq">常见问题</a> ·
                    <a href="#sponsor">赞助</a>
                </p>
            </section>
        </main>
        <footer class="footer" id="pageFooter"></footer>
    </div>

    <div class="theme-switch" id="themeSwitch" role="group" aria-label="主题切换">
        <span class="theme-switch-knob" aria-hidden="true"></span>
        <button class="theme-switch-btn" type="button" data-theme-value="light" aria-label="亮色主题" aria-pressed="true">
            <span class="theme-icon icon-sun" aria-hidden="true"></span>
        </button>
        <button class="theme-switch-btn" type="button" data-theme-value="dark" aria-label="暗色主题" aria-pressed="false">
            <span class="theme-icon icon-moon" aria-hidden="true"></span>
        </button>
    </div>

    <div class="modal-overlay" id="downloadModal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true" hidden>
        <div class="modal-box">
            <h3 id="modal-title"></h3>
            <p id="modal-desc"></p>
            <div class="modal-buttons">
                <button class="btn-cancel" type="button" onclick="closeDownloadModal()"></button>
                <button class="btn-confirm" type="button" id="modal-confirm-btn" onclick="confirmDownload()"></button>
            </div>
        </div>
    </div>

    <div class="faq-modal-overlay" id="faqModal" role="dialog" aria-modal="true" aria-labelledby="faq-modal-title" aria-hidden="true" hidden>
        <div class="faq-modal">
            <div class="faq-modal-header">
                <h3 id="faq-modal-title"></h3>
                <button class="faq-modal-close" type="button" id="faq-modal-close" aria-label="关闭">✕</button>
            </div>
            <div class="faq-meta" id="faq-modal-meta"></div>
            <div class="faq-modal-body" id="faq-modal-body"></div>
        </div>
    </div>

    <script src="./js/app.js" defer></script>

</body>
</html>
